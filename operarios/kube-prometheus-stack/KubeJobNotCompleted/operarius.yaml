apiVersion: openfero.io/v1alpha1
kind: Operarius
metadata:
  name: stuck-job-cleanup
  namespace: openfero
spec:
  alertSelector:
    alertname: KubeJobNotCompleted
    status: firing
    # This template matches every KubeJobNotCompleted alert cluster-wide by
    # default, deleting an ACTIVE job (and its running pods). Some jobs are
    # legitimately long-running - scope this to your own environment before
    # enabling. Any label already present on the alert works here (e.g.
    # namespace); arbitrary Kubernetes object labels are NOT automatically
    # available unless kube-state-metrics is configured to expose them and
    # the alerting rule joins on them.
    # labels:
    #   namespace: my-app-namespace

  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 7200
      template:
        spec:
          serviceAccountName: openfero-stuck-job-cleaner
          restartPolicy: Never
          containers:
            - name: stuck-job-cleaner
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "=== KubeJobNotCompleted Remediation ==="
                  echo "Job: ${OPENFERO_JOB_NAME}"
                  echo "Namespace: ${OPENFERO_NAMESPACE}"
                  echo ""
                  echo "WARNING: This job is still ACTIVE (not failed) - it is being"
                  echo "deleted only because it has been running far longer than expected."
                  echo ""

                  # Validate required variables
                  if [ -z "${OPENFERO_JOB_NAME}" ] || [ -z "${OPENFERO_NAMESPACE}" ]; then
                    echo "ERROR: Missing required environment variables"
                    exit 1
                  fi

                  # Check if job exists
                  if ! kubectl get job "${OPENFERO_JOB_NAME}" -n "${OPENFERO_NAMESPACE}" > /dev/null 2>&1; then
                    echo "Job not found - may have already been deleted"
                    exit 0
                  fi

                  # Get job status
                  echo "Job status:"
                  kubectl get job "${OPENFERO_JOB_NAME}" -n "${OPENFERO_NAMESPACE}" -o wide
                  echo ""

                  # Get pod logs for debugging before deleting the still-running pods
                  echo "=== Active Pod Logs (last 50 lines) ==="
                  POD=$(kubectl get pods -n "${OPENFERO_NAMESPACE}" -l job-name="${OPENFERO_JOB_NAME}" \
                    -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)

                  if [ -n "${POD}" ]; then
                    kubectl logs "${POD}" -n "${OPENFERO_NAMESPACE}" --tail=50 2>/dev/null || echo "Could not retrieve logs"
                  else
                    echo "No pods found for job"
                  fi
                  echo ""

                  # Delete stuck job (and its still-running pods)
                  echo "Cleaning up stuck job..."
                  kubectl delete job "${OPENFERO_JOB_NAME}" -n "${OPENFERO_NAMESPACE}" --ignore-not-found=true

                  echo ""
                  echo "Stuck job cleaned up successfully"
                  echo "NOTE: Investigate logs above to fix root cause before re-running the job"
                  exit 0

  priority: 35
  # Template: review scope/priority/dedup above, then flip to true.
  enabled: false

  deduplication:
    enabled: true
    ttl: 3600
