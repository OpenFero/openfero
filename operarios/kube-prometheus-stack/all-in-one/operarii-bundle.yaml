# =============================================================================
# Operarius: KubeJobNotCompleted
# Priority: 35 (Lowest)
# NOTE: Deletes still-ACTIVE jobs (and their running pods) - review before enabling!
# =============================================================================
apiVersion: openfero.io/v1alpha1
kind: Operarius
metadata:
  name: stuck-job-cleanup
  namespace: openfero
spec:
  alertSelector:
    alertname: KubeJobNotCompleted
    status: firing
    # Template: matches cluster-wide by default. Scope via labels (e.g.
    # namespace) before enabling - see ../KubeJobNotCompleted/operarius.yaml
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 7200
      template:
        spec:
          serviceAccountName: openfero-stuck-job-cleaner
          restartPolicy: Never
          containers:
            - name: stuck-job-cleaner
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "=== KubeJobNotCompleted Remediation ==="
                  echo "Job: ${OPENFERO_JOB_NAME}"
                  echo "Namespace: ${OPENFERO_NAMESPACE}"
                  echo ""
                  if [ -z "${OPENFERO_JOB_NAME}" ] || [ -z "${OPENFERO_NAMESPACE}" ]; then
                    echo "ERROR: Missing required environment variables"
                    exit 1
                  fi
                  if ! kubectl get job "${OPENFERO_JOB_NAME}" -n "${OPENFERO_NAMESPACE}" > /dev/null 2>&1; then
                    echo "Job not found - may have already been deleted"
                    exit 0
                  fi
                  kubectl get job "${OPENFERO_JOB_NAME}" -n "${OPENFERO_NAMESPACE}" -o wide
                  POD=$(kubectl get pods -n "${OPENFERO_NAMESPACE}" -l job-name="${OPENFERO_JOB_NAME}" \
                    -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
                  [ -n "${POD}" ] && kubectl logs "${POD}" -n "${OPENFERO_NAMESPACE}" --tail=50 2>/dev/null || echo "No logs available"
                  echo "Cleaning up stuck job..."
                  kubectl delete job "${OPENFERO_JOB_NAME}" -n "${OPENFERO_NAMESPACE}" --ignore-not-found=true
                  echo "Stuck job cleaned up successfully"
  priority: 35
  enabled: false # Template: review scope above, then flip to true
  deduplication:
    enabled: true
    ttl: 3600
